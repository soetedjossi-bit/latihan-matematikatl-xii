<main class="w"><div class="hero"><p class="how"><b>Cara belajar:</b> pilih indikator, jawab dulu, tekan <b>Cek Jawaban</b>, baca <b>Pembahasan</b> formal dan <b>Secret Hack</b> (jalan pintas cepat). Indikator <b>Tuntas</b> bila semua soalnya benar.</p>

<script>
var T="pg",M="mj",E="es";
var D=[
{t:1,ind:"Saya dapat menentukan kecepatan sesaat dari fungsi posisi dengan limit $\\frac{s(a+h)-s(a)}{h}$ untuk $h\\to0$.",qs:[
{y:T,q:"Posisi benda $s(t)=3t^2+2t$ meter. Kecepatan sesaat pada $t=2$ s adalah ....",o:["8 m/s","12 m/s","14 m/s","16 m/s","28 m/s"],a:2,e:"$s(2+h)-s(2)=3(4+4h+h^2)+2(2+h)-16=14h+3h^2$.\nDibagi $h$: $14+3h$. Untuk $h\\to0$ hasilnya 14 m/s.\nKeliru umum: 16 adalah posisi $s(2)$, bukan kecepatan.",h:"Kecepatan sesaat = turunan. Untuk $at^2+bt$: $v=2at+b$, jadi $2(3)(2)+2=14$."},
{y:T,q:"Posisi drone $s(t)=5t^2-4t$ meter. Nilai $\\lim_{h\\to0}\\frac{s(3+h)-s(3)}{h}$ adalah ....",o:["22","26","30","33","45"],a:1,e:"$s(3+h)-s(3)=5(9+6h+h^2)-4(3+h)-33=26h+5h^2$.\nDibagi $h$ lalu $h\\to0$: 26 m/s.",h:"Langsung $v=10t-4$; di $t=3$ diperoleh 26. Jangan hitung ulang limitnya."}]},
{t:1,ind:"Saya dapat menentukan limit fungsi trigonometri bentuk $\\frac{\\sin ax}{bx}$ dan $\\frac{\\sin ax}{\\tan bx}$ untuk $x\\to0$.",qs:[
{y:T,q:"$\\lim_{x\\to0}\\frac{\\sin 6x}{\\tan 2x}=$ ....",o:["$\\frac13$","1","3","6","12"],a:2,e:"Gunakan $\\lim\\frac{\\sin ax}{bx}=\\frac ab$ dan $\\lim\\frac{ax}{\\tan bx}=\\frac ab$.\n$\\frac{\\sin6x}{\\tan2x}\\to\\frac62=3$.",h:"Untuk $x\\to0$: $\\sin$ dan $\\tan$ boleh dibuang, sisakan koefisiennya. Hasil = angka atas : angka bawah."},
{y:T,q:"Amplitudo $A(\\beta)=\\frac{10\\sin4\\beta}{\\beta}$ mV. Nilai $A$ untuk $\\beta\\to0$ adalah ....",o:["0 mV","4 mV","10 mV","14 mV","40 mV"],a:4,e:"$\\lim\\frac{\\sin4\\beta}{\\beta}=4$, sehingga $A\\to10\\times4=40$ mV.\nKeliru umum: menganggap $\\frac{\\sin4\\beta}{\\beta}\\to1$.",h:"$\\sin(a\\beta)/\\beta$ sama dengan $a$. Kalikan dengan konstanta di depan."}]},
{t:1,ind:"Saya dapat menentukan limit fungsi di tak hingga (perbandingan pangkat tertinggi dan perkalian sekawan).",qs:[
{y:T,q:"$v(t)=\\frac{8t^2+3t}{2t^2+5}$ m/s. Untuk $t\\to\\infty$, $v$ mendekati ....",o:["0 m/s","$\\frac35$ m/s","4 m/s","8 m/s","$\\infty$"],a:2,e:"Bagi pembilang dan penyebut dengan $t^2$: $\\frac{8+3/t}{2+5/t^2}\\to\\frac82=4$ m/s.",h:"Pangkat tertinggi sama: ambil koefisien depan. $8\\div2=4$."},
{y:T,q:"$\\lim_{x\\to\\infty}\\left(\\sqrt{x^2+10x}-x\\right)=$ ....",o:["0","1","5","10","$\\infty$"],a:2,e:"Kalikan sekawan: $\\frac{10x}{\\sqrt{x^2+10x}+x}$. Bagi $x$: $\\frac{10}{\\sqrt{1+10/x}+1}\\to\\frac{10}{2}=5$.\nKeliru umum: $\\infty-\\infty$ dianggap 0.",h:"Bentuk $\\sqrt{x^2+px}-x$ selalu $\\to \\frac p2$. Di sini $10/2=5$."}]},
{t:1,ind:"Saya dapat mengevaluasi pernyataan tentang limit (bentuk tak tentu, limit di tak hingga, limit trigonometri).",qs:[
{y:M,q:"Perhatikan pernyataan berikut!\n(1) $\\lim_{x\\to3}\\frac{x^2-9}{x-3}=6$\n(2) Bentuk $\\frac00$ berarti limitnya tidak ada.\n(3) $\\lim_{x\\to\\infty}\\frac{5x^2+1}{x^2-2}=5$\n(4) $\\lim_{x\\to0}\\frac{\\sin2x}{x}=1$\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1) dan (3) saja","(2) dan (4) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:1,e:"(1) Benar: $\\frac{(x-3)(x+3)}{x-3}=x+3\\to6$.\n(2) Salah: $\\frac00$ adalah bentuk tak tentu, bukan tanda limit tidak ada.\n(3) Benar: $\\frac51=5$.\n(4) Salah: nilainya 2.",h:"$\\frac00$ = faktorkan dulu. $\\frac\\infty\\infty$ = bandingkan pangkat tertinggi. $\\sin ax/x=a$ (bukan 1)."},
{y:M,q:"Diketahui $f(x)=\\sqrt{x^2+6x}-x$. Perhatikan pernyataan!\n(1) $\\lim_{x\\to\\infty}f(x)=3$\n(2) $f(x)=\\frac{6x}{\\sqrt{x^2+6x}+x}$\n(3) $\\lim_{x\\to\\infty}f(x)=0$\n(4) $\\lim_{x\\to\\infty}f(x)=\\infty$\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1) dan (3) saja","(2) dan (4) saja","(1), (2), dan (3) saja","(3) dan (4) saja"],a:0,e:"Kalikan sekawan: $f(x)=\\frac{6x}{\\sqrt{x^2+6x}+x}$ (pernyataan 2 benar).\nBagi $x$: $\\frac{6}{\\sqrt{1+6/x}+1}\\to3$ (pernyataan 1 benar). Pernyataan (3) dan (4) salah.",h:"Pakai rumus kilat $\\sqrt{x^2+px}-x\\to\\frac p2=3$. Cek sisanya dengan sekawan."}]},
{t:2,ind:"Saya dapat menurunkan fungsi dengan aturan hasil kali dan aturan rantai, lalu menghitung nilainya di suatu titik.",qs:[
{y:T,q:"$P(t)=(2t-1)(t^2+3)$. Laju perubahan $P$ pada $t=2$ adalah ....",o:["8","12","14","26","28"],a:3,e:"$P'=u'v+uv'=2(t^2+3)+(2t-1)(2t)$.\nDi $t=2$: $2(7)+3(4)=14+12=26$.\nKeliru umum: $u'v'=2\\times4=8$.",h:"Hasil kali: turunkan satu, kalikan yang lain, lalu jumlahkan. Hitung nilai $u,v,u',v'$ di titiknya saja, tidak perlu menyederhanakan."},
{y:T,q:"$V(t)=(3t^2+1)^3$. Laju perubahan $V$ pada $t=1$ adalah ....",o:["48","96","144","288","432"],a:3,e:"Aturan rantai: $V'=3(3t^2+1)^2\\cdot6t$.\nDi $t=1$: $3(16)(6)=288$.\nKeliru umum: lupa mengalikan turunan bagian dalam ($6t$).",h:"Rantai: pangkat turun, kalikan turunan isi kurung. Substitusi $t$ di akhir."}]},
{t:2,ind:"Saya dapat menurunkan fungsi sinus dan kosinus dengan aturan rantai dan menghitung kecepatan pada sudut tertentu.",qs:[
{y:T,q:"$y(t)=8\\sin3t$ cm. Kecepatan pada $t=\\frac\\pi9$ s adalah ....",o:["$-12$ cm/s","$4\\sqrt3$ cm/s","12 cm/s","24 cm/s","0 cm/s"],a:2,e:"$v=y'=24\\cos3t$. Di $t=\\frac\\pi9$: $\\cos\\frac\\pi3=\\frac12$.\n$v=24\\times\\frac12=12$ cm/s.",h:"$\\frac{d}{dt}\\sin kt=k\\cos kt$. Hafalkan nilai sudut istimewa: $\\cos60^\\circ=\\frac12$."},
{y:T,q:"$y(t)=6\\cos2t$ cm. Kecepatan pada $t=\\frac\\pi4$ s adalah ....",o:["$-12$ cm/s","$-6$ cm/s","0 cm/s","6 cm/s","12 cm/s"],a:0,e:"Turunan $\\cos$ adalah $-\\sin$: $v=-12\\sin2t$.\nDi $t=\\frac\\pi4$: $\\sin\\frac\\pi2=1$, sehingga $v=-12$ cm/s.",h:"$\\cos$ diturunkan menjadi $-\\sin$ dan kalikan koefisien dalam: $-(6)(2)=-12$."}]},
{t:2,ind:"Saya dapat menganalisis pernyataan tentang turunan pertama dan kedua fungsi sinusoidal serta hasil bagi.",qs:[
{y:M,q:"Simpangan $y(t)=3\\sin2t$. Perhatikan pernyataan!\n(1) $v=6\\cos2t$\n(2) $a=-12\\sin2t$\n(3) Kecepatan maksimum adalah 3\n(4) $a=-4y$\nPernyataan yang benar adalah ....",o:["(1), (2), dan (3) saja","(1), (2), dan (4) saja","(2), (3), dan (4) saja","(1) dan (3) saja","(1), (2), (3), dan (4)"],a:1,e:"(1) $v=y'=6\\cos2t$ benar. (2) $a=v'=-12\\sin2t$ benar.\n(3) Salah: $v_{maks}=6$. (4) Benar: $a=-12\\sin2t=-4(3\\sin2t)=-4y$.",h:"Untuk $y=A\\sin\\omega t$: $v_{maks}=A\\omega$ dan $a=-\\omega^2y$. Di sini $\\omega=2$, $A=3$."},
{y:M,q:"Diketahui $f(x)=\\frac{x}{x^2+1}$ dengan $f'(x)=\\frac{1-x^2}{(x^2+1)^2}$. Perhatikan pernyataan!\n(1) $f'(0)=1$\n(2) $f'(1)=0$\n(3) $f'(2)=\\frac{3}{25}$\n(4) $f'(1)=\\frac12$\nPernyataan yang benar adalah ....",o:["(1) saja","(1), (2), dan (3) saja","(1) dan (2) saja","(2) dan (4) saja","(3) dan (4) saja"],a:2,e:"(1) $f'(0)=\\frac11=1$ benar. (2) $f'(1)=0$ benar.\n(3) $f'(2)=\\frac{-3}{25}$, jadi salah. (4) salah karena $f'(1)=0$.",h:"Substitusi langsung ke $f'$, lihat dulu tanda pembilangnya $(1-x^2)$: positif untuk $|x|<1$, nol di $x=1$, negatif untuk $x=2$."}]},
{t:3,ind:"Saya dapat menentukan saat benda berhenti sesaat dan percepatannya dari fungsi posisi.",qs:[
{y:T,q:"$s(t)=t^3-9t^2+24t$ meter. Benda berhenti sesaat pada $t=$ ....",o:["2 s dan 4 s","3 s saja","1 s dan 3 s","4 s saja","0 s dan 2 s"],a:0,e:"$v=s'=3t^2-18t+24=3(t-2)(t-4)$.\nBerhenti sesaat saat $v=0$: $t=2$ s dan $t=4$ s.",h:"Bagi koefisien dengan 3: $t^2-6t+8=0$. Jumlah akar 6 dan hasil kali 8, jadi 2 dan 4."},
{y:T,q:"Untuk $s(t)$ yang sama, percepatan saat benda pertama kali berhenti sesaat adalah ....",o:["$-12$ m/s²","$-6$ m/s²","0 m/s²","6 m/s²","12 m/s²"],a:1,e:"$a=v'=6t-18$. Pertama kali berhenti: $t=2$.\n$a(2)=12-18=-6$ m/s².",h:"Percepatan di akar-akar $v$ berlawanan tanda: $a(2)=-6$ dan $a(4)=+6$."}]},
{t:3,ind:"Saya dapat menentukan nilai ekstrem dan interval naik atau turun fungsi dengan turunan pertama.",qs:[
{y:T,q:"$h(t)=30t-5t^2$ meter. Tinggi maksimum bola adalah ....",o:["30 m","45 m","60 m","90 m","180 m"],a:1,e:"$h'=30-10t=0\\Rightarrow t=3$ s. $h(3)=90-45=45$ m.\nMaksimum karena $h''=-10<0$.",h:"Untuk $h=bt-5t^2$: $h_{maks}=\\frac{b^2}{20}=\\frac{900}{20}=45$."},
{y:T,q:"$f(x)=2x^3-9x^2+12x$. Fungsi $f$ turun pada interval ....",o:["$x<1$","$1<x<2$","$x>2$","$x<1$ atau $x>2$","tidak pernah turun"],a:1,e:"$f'=6x^2-18x+12=6(x-1)(x-2)$.\n$f'<0$ (turun) di antara akar-akar: $1<x<2$.",h:"Kubik berkoefisien depan positif: naik, turun, naik. Turun hanya di antara dua akar $f'$."}]},
{t:3,ind:"Saya dapat menyusun model dan menyelesaikan masalah optimasi (volume kotak dari karton).",qs:[
{y:T,q:"Karton persegi 24 cm $\\times$ 24 cm dipotong persegi sisi $x$ di tiap sudut untuk membuat kotak tanpa tutup. Volume maksimum dicapai saat $x=$ ....",o:["3 cm","4 cm","6 cm","8 cm","12 cm"],a:1,e:"$V=x(24-2x)^2$. $V'=(24-2x)(24-6x)=0$.\n$x=12$ (alas menjadi 0, tidak mungkin) atau $x=4$ cm. $V''(4)<0$ sehingga maksimum.",h:"Kotak dari persegi sisi $L$: $x=\\frac L6=\\frac{24}6=4$. Selalu berlaku!"},
{y:T,q:"Pada kotak yang sama (24 cm $\\times$ 24 cm), volume maksimum kotak adalah ....",o:["1.024 cm³","1.152 cm³","1.296 cm³","1.728 cm³","2.304 cm³"],a:0,e:"$x=4$: sisi alas $24-2(4)=16$ cm, tinggi 4 cm.\n$V=4\\times16^2=1.024$ cm³.",h:"Rumus kilat: $V_{maks}=\\frac{2L^3}{27}=\\frac{2(13.824)}{27}=1.024$."}]},
{t:3,ind:"Saya dapat menguraikan penyelesaian soal uraian: stasioner, jenis ekstrem, dan optimasi, dengan langkah runtut.",qs:[
{y:E,q:"Diketahui $f(x)=x^3-6x^2+9x+1$.\na. Tentukan interval $f$ naik dan turun.\nb. Tentukan titik stasioner beserta jenisnya.\nc. Tentukan titik belok.",e:"a. $f'=3x^2-12x+9=3(x-1)(x-3)$. Naik: $x<1$ atau $x>3$. Turun: $1<x<3$.\nb. $f'=0$ di $x=1$ dan $x=3$. $f(1)=5$ dan $f(3)=1$. Tanda $f'$ berubah $+\\to-$ di $x=1$ (maksimum lokal $(1,5)$), $-\\to+$ di $x=3$ (minimum lokal $(3,1)$).\nc. $f''=6x-12=0\\Rightarrow x=2$, $f(2)=3$. Titik belok $(2,3)$.",h:"Titik belok selalu tepat di tengah dua titik stasioner pada kubik: $x=\\frac{1+3}2=2$. Gunakan untuk memeriksa jawabanmu."},
{y:E,q:"Seutas tali sepanjang 40 m dibentuk menjadi persegi panjang.\na. Susun fungsi luas $L(x)$ dengan $x$ sebagai panjang.\nb. Tentukan ukuran yang membuat luas maksimum dan buktikan itu maksimum.\nc. Berapa luas maksimumnya?",e:"a. Lebar $=20-x$, sehingga $L(x)=x(20-x)=20x-x^2$.\nb. $L'=20-2x=0\\Rightarrow x=10$. $L''=-2<0$, jadi maksimum. Ukuran $10\\times10$ m (persegi).\nc. $L_{maks}=10\\times10=100$ m².",h:"Keliling tetap: luas maksimum selalu saat bentuknya persegi, sisi $=\\frac{\\text{keliling}}{4}=10$."}]},
{t:3,ind:"Saya dapat mengevaluasi keputusan teknis dan pernyataan tentang ekstrem dengan turunan dan perhitungan nilai fungsi.",qs:[
{y:T,q:"Kotak tanpa tutup dari karton 24 cm $\\times$ 24 cm memiliki $V(x)=x(24-2x)^2$ dengan volume maksimum 1.024 cm³ pada $x=4$. Bengkel memilih $x=5$ cm dengan batas toleransi penurunan volume 3%. Keputusan yang paling tepat adalah ....",o:["Layak, karena $V(5)=980$ cm³ hanya turun sekitar 2%.","Tidak layak, karena $V(5)=980$ cm³ turun sekitar 4,3%, melebihi 3%.","Tidak layak, karena $x=5$ bukan titik stasioner sehingga volumenya nol.","Layak, karena $V(5)>V(4)$.","Layak, karena $x=5$ lebih dekat ke 6 daripada ke 4."],a:1,e:"$V(5)=5(14)^2=980$ cm³.\nPenurunan $=\\frac{1.024-980}{1.024}\\times100\\%\\approx4{,}3\\%$, lebih dari 3%, sehingga tidak layak.",h:"Hitung dulu nilai fungsi di ukuran pilihan, lalu bandingkan persentase selisihnya dengan batas toleransi. Jangan menilai hanya dari kata 'dekat optimum'."},
{y:M,q:"Diketahui $f(x)=x^3-3x^2$. Perhatikan pernyataan!\n(1) $f'(x)=3x^2-6x$\n(2) Titik stasioner di $x=0$ dan $x=2$\n(3) $x=0$ memberi maksimum lokal bernilai 0\n(4) $x=2$ memberi maksimum lokal\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1), (2), dan (3) saja","(2), (3), dan (4) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:1,e:"(1) Benar. (2) $3x(x-2)=0$, benar.\n(3) $f'$ berubah $+\\to-$ di $x=0$ dan $f(0)=0$, benar.\n(4) Salah: $f''(2)=6>0$, jadi $x=2$ minimum lokal dengan $f(2)=-4$.",h:"Kubik berkoefisien depan positif: maksimum lokal di akar $f'$ yang kiri, minimum lokal di akar yang kanan."}]},
{t:3,ind:"Saya dapat mengevaluasi klaim dan merancang solusi optimum kontekstual (iluminasi dan tandon) dengan uraian lengkap.",qs:[
{y:E,q:"Lampu titik dipasang pada tiang setinggi $h$ m di atas titik O. Titik P pada lantai berjarak 3 m dari O. Iluminasi di P adalah $E(h)=\\frac{kh}{(h^2+9)^{3/2}}$, $k>0$. Teknisi berpendapat: \"Makin tinggi lampu, makin terang P, jadi pasang di 5 m.\"\na. Tentukan $E'(h)$ dan sederhanakan.\nb. Tentukan $h$ yang memberi iluminasi maksimum dan buktikan itu maksimum.\nc. Evaluasi pendapat teknisi dengan membandingkan $E(5)$ dan iluminasi maksimum.",e:"a. $E'=k\\frac{(h^2+9)^{3/2}-h\\cdot3h(h^2+9)^{1/2}}{(h^2+9)^3}=\\frac{k(9-2h^2)}{(h^2+9)^{5/2}}$.\nb. $E'=0\\Rightarrow h^2=\\frac92$, $h=\\frac{3}{\\sqrt2}\\approx2{,}12$ m. $E'>0$ untuk $h<2{,}12$ dan $E'<0$ untuk $h>2{,}12$, sehingga maksimum.\nc. $E_{maks}\\approx\\frac{2{,}12k}{(13{,}5)^{3/2}}\\approx0{,}0428k$, sedangkan $E(5)=\\frac{5k}{34^{3/2}}\\approx0{,}0252k$ (sekitar 59% dari maksimum). Pendapat teknisi keliru; rekomendasi: pasang lampu sekitar 2,1 m.",h:"Lampu di atas titik berjarak $d$: iluminasi maksimum saat $h=\\frac{d}{\\sqrt2}\\approx0{,}71d$. Dengan $d=3$: $h\\approx2{,}12$."},
{y:E,q:"Tim sekolah merancang bak air tanpa tutup berbentuk balok beralas persegi sisi $x$ dm dan tinggi $h$ dm, volume 32 dm³. Bahan paling sedikit diinginkan, dan tinggi tidak boleh lebih dari 1,5 dm.\na. Susun luas bahan $A(x)$ dalam $x$ saja.\nb. Tentukan $x$ yang meminimumkan $A$ tanpa batas tinggi, buktikan minimum, dan hitung $h$. Apakah memenuhi batas tinggi?\nc. Buat rancangan akhir yang memenuhi batas tinggi dan sajikan dimensi serta luas bahannya.",e:"a. $h=\\frac{32}{x^2}$, $A=x^2+4xh=x^2+\\frac{128}{x}$.\nb. $A'=2x-\\frac{128}{x^2}=0\\Rightarrow x^3=64$, $x=4$ dm, $h=2$ dm. $A''=2+\\frac{256}{x^3}>0$, jadi minimum. Tinggi 2 dm melebihi 1,5 dm, maka tidak memenuhi.\nc. Batas $h\\le1{,}5$ berarti $x^2\\ge\\frac{64}{3}$, $x\\ge4{,}62$. Karena $A$ naik untuk $x>4$, pilih batas terkecil: $x\\approx4{,}62$ dm, $h=1{,}5$ dm, $A\\approx21{,}33+27{,}71\\approx49{,}05$ dm² (lebih besar dari 48 dm² tanpa batas, wajar karena ada kendala).",h:"Bak tanpa tutup beralas persegi: biaya minimum saat $h=\\frac x2$. Jika batas membuat titik optimum tak layak, pilih ukuran terdekat di sisi yang diperbolehkan."}]},
{t:1,ind:"Saya dapat menganalisis grafik fungsi untuk menyimpulkan limit di tak hingga dan asimtot datar.",qs:[
{y:T,q:"Suhu air yang didinginkan dimodelkan $T(t)=20+\\frac{60}{t+3}$ °C, $t$ dalam menit. Grafiknya ditunjukkan di bawah.\n<svg viewBox='0 0 340 190' width='100%' style='max-width:460px' role='img' aria-label='Grafik suhu air terhadap waktu dengan asimtot datar T=20'><g stroke='currentColor' fill='none' stroke-width='1.2'><path d='M40 12V170H330'/><path d='M109 30V170' stroke-dasharray='2 4' opacity='.3'/><path d='M178 30V170' stroke-dasharray='2 4' opacity='.3'/><path d='M247 30V170' stroke-dasharray='2 4' opacity='.3'/><path d='M316 30V170' stroke-dasharray='2 4' opacity='.3'/><polyline stroke='#7048e8' stroke-width='2.5' stroke-linejoin='round' points='40.0,40.0 45.8,54.3 51.5,65.0 57.2,73.3 63.0,80.0 68.8,85.5 74.5,90.0 80.2,93.8 86.0,97.1 91.8,100.0 97.5,102.5 103.2,104.7 109.0,106.7 114.8,108.4 120.5,110.0 126.2,111.4 132.0,112.7 137.8,113.9 143.5,115.0 149.2,116.0 155.0,116.9 160.8,117.8 166.5,118.6 172.2,119.3 178.0,120.0 183.8,120.6 189.5,121.2 195.2,121.8 201.0,122.4 206.8,122.9 212.5,123.3 218.2,123.8 224.0,124.2 229.8,124.6 235.5,125.0 241.2,125.4 247.0,125.7 252.8,126.0 258.5,126.4 264.2,126.7 270.0,127.0 275.8,127.2 281.5,127.5 287.2,127.8 293.0,128.0 298.8,128.2 304.5,128.5 310.2,128.7 316.0,128.9'/><path stroke='#0ca678' stroke-width='1.8' stroke-dasharray='6 4' d='M40 140H330'/></g><circle cx='40' cy='40' r='3.5' fill='#7048e8'/><g fill='currentColor' font-size='10'><text x='12' y='144'>20</text><text x='12' y='44'>40</text><text x='46' y='36'>(0, 40)</text><text x='190' y='156' fill='#0ca678'>asimtot datar T = 20</text><text x='36' y='183'>0</text><text x='105' y='183'>6</text><text x='174' y='183'>12</text><text x='243' y='183'>18</text><text x='312' y='183'>24</text><text x='290' y='164'>t (menit)</text><text x='46' y='20'>T (°C)</text></g></svg>\nKesimpulan yang tepat berdasarkan grafik dan $\\lim_{t\\to\\infty}T(t)$ adalah ....",o:["Suhu air menjadi 0 °C setelah waktu yang sangat lama.","Suhu air tepat 20 °C pada $t=60$ menit.","Suhu air mendekati 20 °C tetapi tidak pernah tepat 20 °C; garis $T=20$ adalah asimtot datar.","Suhu air kembali mendekati 40 °C untuk $t$ yang sangat besar.","Suhu air mendekati 3 °C untuk $t$ yang sangat besar."],a:2,e:"$\\lim_{t\\to\\infty}\\frac{60}{t+3}=0$, sehingga $T\\to20$.\nKarena $\\frac{60}{t+3}>0$ untuk semua $t$, nilai $T$ selalu lebih dari 20. Grafik mendekati garis $T=20$ tanpa menyentuhnya: itu asimtot datar.",h:"Fungsi 'konstanta + pecahan': limit di tak hingga adalah konstantanya, karena suku pecahan menuju 0. Garis putus-putus pada grafik adalah konstanta itu."},
{y:M,q:"Untuk fungsi $T(t)=20+\\frac{60}{t+3}$ pada soal sebelumnya, perhatikan pernyataan!\n(1) $T(0)=40$\n(2) $\\lim_{t\\to\\infty}T(t)=20$\n(3) $T$ turun untuk semua $t\\ge0$\n(4) $T(t)=20$ tercapai pada $t=57$\nPernyataan yang benar adalah ....",o:["(1), (2), dan (4) saja","(2), (3), dan (4) saja","(1), (2), dan (3) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:2,e:"(1) $T(0)=20+20=40$, benar. (2) Benar.\n(3) $T'(t)=-\\frac{60}{(t+3)^2}<0$, benar.\n(4) Salah: $\\frac{60}{t+3}=0$ tidak pernah terpenuhi.",h:"Turunan pecahan positif selalu negatif: fungsinya turun terus. Dan karena suku pecahan tidak pernah nol, nilai asimtot tidak pernah tercapai."}]},
{t:2,ind:"Saya dapat menganalisis grafik posisi-waktu: hubungan gradien garis singgung dengan kecepatan sesaat dan kecepatan rata-rata.",qs:[
{y:T,q:"Grafik posisi-waktu sebuah gerobak $s(t)=t^2$ meter ditunjukkan di bawah. Garis putus-putus adalah garis singgung di $P(3\\text{ s};9\\text{ m})$ yang memotong sumbu-$t$ di $t=1,5$ s.\n<svg viewBox='0 0 340 200' width='100%' style='max-width:460px' role='img' aria-label='Grafik posisi waktu s=t kuadrat dengan garis singgung di titik P(3;9)'><g stroke='currentColor' fill='none' stroke-width='1.2'><path d='M40 10V170H325'/><path d='M226 89V170M40 89H226' stroke-dasharray='2 4' opacity='.45'/><polyline stroke='#3b5bdb' stroke-width='2.5' stroke-linejoin='round' points='40.0,170.0 52.4,169.6 64.8,168.6 77.2,166.8 89.6,164.2 102.0,161.0 114.4,157.0 126.8,152.4 139.2,147.0 151.6,140.8 164.0,134.0 176.4,126.4 188.8,118.2 201.2,109.2 213.6,99.4 226.0,89.0 238.4,77.8 250.8,66.0 263.2,53.4 275.6,40.0 288.0,26.0'/><path stroke='#d9822b' stroke-width='2' stroke-dasharray='6 4' d='M133 170L276 45.8'/></g><circle cx='226' cy='89' r='4.5' fill='#c2352b'/><g fill='currentColor' font-size='10'><text x='232' y='84'>P(3; 9)</text><text x='28' y='93'>9</text><text x='222' y='183'>3</text><text x='129' y='183'>1,5</text><text x='36' y='183'>0</text><text x='282' y='44' fill='#d9822b'>garis singgung di P</text><text x='290' y='164'>t (s)</text><text x='46' y='20'>s (m)</text></g></svg>\nPernyataan yang tepat tentang kecepatan gerobak adalah ....",o:["Kecepatan sesaat di $P$ adalah 6 m/s, dua kali kecepatan rata-rata 0 sampai 3 s.","Kecepatan sesaat di $P$ adalah 3 m/s, sama dengan kecepatan rata-rata 0 sampai 3 s.","Kecepatan sesaat di $P$ adalah 9 m/s karena posisi di $P$ adalah 9 m.","Kecepatan sesaat di $P$ adalah 6 m/s, sama dengan kecepatan rata-rata 0 sampai 3 s.","Kecepatan sesaat di $P$ adalah 4,5 m/s, 1,5 kali kecepatan rata-rata 0 sampai 3 s."],a:0,e:"Gradien garis singgung $=\\frac{9-0}{3-1,5}=6$, jadi kecepatan sesaat di $P$ adalah 6 m/s.\nKecepatan rata-rata 0 sampai 3 s $=\\frac{9-0}{3-0}=3$ m/s. Jadi 6 m/s adalah dua kali 3 m/s.\nKeliru umum: menyamakan posisi (9 m) dengan kecepatan.",h:"Kecepatan sesaat = gradien garis singgung = tinggi dibagi jarak ke titik potong sumbu-$t$. Untuk $s=at^2$ dari nol, kecepatan sesaat selalu 2 kali kecepatan rata-ratanya."}]},
{t:2,ind:"Saya dapat menemukan kesalahan pada langkah penurunan dan mengevaluasi penyelesaian limit siswa lain.",qs:[
{y:T,q:"Seorang siswa menurunkan $f(x)=x^2\\cos x$ dengan langkah berikut.\nLangkah 1: Misalkan $u=x^2$ dan $v=\\cos x$, sehingga $f'=u'v+uv'$.\nLangkah 2: $u'=2x$ dan $v'=\\sin x$.\nLangkah 3: $f'(x)=2x\\cos x+x^2\\sin x$.\nBagian yang keliru adalah ....",o:["Langkah 1, karena aturan hasil kali seharusnya $u'v'$.","Langkah 3, karena penjumlahan harus diubah menjadi pengurangan.","Langkah 2, karena turunan $\\cos x$ adalah $-\\sin x$, bukan $\\sin x$.","Tidak ada kesalahan.","Langkah 1 dan Langkah 2."],a:2,e:"Aturan hasil kali pada Langkah 1 sudah benar, dan $u'=2x$ benar.\nKesalahan ada pada $v'$: $\\frac{d}{dx}\\cos x=-\\sin x$.\nHasil yang benar: $f'(x)=2x\\cos x-x^2\\sin x$.",h:"Ingat urutan: $\\sin\\to\\cos\\to-\\sin\\to-\\cos$. Setiap turunan fungsi kosinus pasti membawa tanda negatif. Periksa tanda lebih dulu saat mencari kesalahan."},
{y:M,q:"Empat siswa menyelesaikan limit berikut.\nSiswa A: $\\lim_{x\\to2}\\frac{x^2-4}{x-2}=\\lim_{x\\to2}(x+2)=4$.\nSiswa B: $\\lim_{x\\to0}\\frac{\\sin3x}{x}=1$.\nSiswa C: $\\lim_{x\\to\\infty}\\frac{3x+1}{x^2+5}=\\infty$ karena pembilang menuju $\\infty$.\nSiswa D: $\\lim_{x\\to\\infty}\\frac{3x+1}{x^2+5}=0$ karena pangkat penyebut lebih besar.\nPenilaian yang tepat adalah ....\n(1) Siswa A benar.\n(2) Siswa B keliru; hasil yang benar 3.\n(3) Siswa C keliru; pembilang dan penyebut sama-sama menuju $\\infty$ dan penyebut tumbuh lebih cepat.\n(4) Siswa D keliru.",o:["(1) dan (4) saja","(2) dan (3) saja","(1), (2), dan (4) saja","(1), (2), dan (3) saja","(1), (2), (3), dan (4)"],a:3,e:"A: benar, faktorkan lalu substitusi $x=2$ sehingga 4.\nB: keliru, $\\lim\\frac{\\sin3x}{x}=3$.\nC: keliru, pangkat penyebut (2) lebih besar daripada pangkat pembilang (1), sehingga limit adalah 0.\nD: benar, jadi pernyataan (4) salah.",h:"Bandingkan pangkat tertinggi: pembilang < penyebut menghasilkan 0, sama menghasilkan rasio koefisien, pembilang > penyebut menghasilkan $\\pm\\infty$."}]},
{t:1,ind:"Saya dapat menyimpulkan kecepatan sesaat sebagai nilai limit dari tabel kecepatan rata-rata pada selang yang makin kecil.",qs:[
{y:T,q:"Posisi sebuah mobil mainan $s(t)=2t^2+5t$ meter. Kecepatan rata-rata pada selang $[3,3+h]$ disajikan pada tabel.<table style='border-collapse:collapse;margin:6px 0;font-size:.9rem'><tr><td style='border:1px solid #999;padding:3px 9px'>$h$ (s)</td><td style='border:1px solid #999;padding:3px 9px'>1</td><td style='border:1px solid #999;padding:3px 9px'>0,1</td><td style='border:1px solid #999;padding:3px 9px'>0,01</td><td style='border:1px solid #999;padding:3px 9px'>0,001</td></tr><tr><td style='border:1px solid #999;padding:3px 9px'>Kec. rata-rata (m/s)</td><td style='border:1px solid #999;padding:3px 9px'>19</td><td style='border:1px solid #999;padding:3px 9px'>17,2</td><td style='border:1px solid #999;padding:3px 9px'>17,02</td><td style='border:1px solid #999;padding:3px 9px'>17,002</td></tr></table>Kecepatan sesaat mobil pada $t=3$ s mendekati ....",o:["2 m/s","17 m/s","19 m/s","21 m/s","34 m/s"],a:1,e:"Nilai kecepatan rata-rata makin kecil selisihnya terhadap 17 saat $h$ mengecil: 19; 17,2; 17,02; 17,002.\nPolanya $17+2h$, sehingga untuk $h\\to0$ limitnya 17 m/s.\nKeliru umum: memilih nilai pertama tabel (19) padahal $h=1$ masih besar.",h:"Lihat baris paling kanan (h paling kecil): angka itu hampir sama dengan limit. Bulatkan ke bilangan yang 'stabil'."},
{y:M,q:"Posisi troli $s(t)=3t^2+4t$ meter. Kecepatan rata-rata pada selang $[2,2+h]$ disajikan pada tabel.<table style='border-collapse:collapse;margin:6px 0;font-size:.9rem'><tr><td style='border:1px solid #999;padding:3px 9px'>$h$ (s)</td><td style='border:1px solid #999;padding:3px 9px'>1</td><td style='border:1px solid #999;padding:3px 9px'>0,1</td><td style='border:1px solid #999;padding:3px 9px'>0,01</td><td style='border:1px solid #999;padding:3px 9px'>0,001</td></tr><tr><td style='border:1px solid #999;padding:3px 9px'>Kec. rata-rata (m/s)</td><td style='border:1px solid #999;padding:3px 9px'>19</td><td style='border:1px solid #999;padding:3px 9px'>16,3</td><td style='border:1px solid #999;padding:3px 9px'>16,03</td><td style='border:1px solid #999;padding:3px 9px'>16,003</td></tr></table>Perhatikan pernyataan!<br>(1) Kecepatan rata-rata pada $h=0,1$ s adalah 16,3 m/s.<br>(2) Makin kecil $h$, kecepatan rata-rata makin mendekati 16 m/s.<br>(3) Nilai limit kecepatan rata-rata sama dengan 19 m/s.<br>(4) Kecepatan rata-rata memenuhi $v=16+3h$, sehingga limitnya 16 m/s.<br>Pernyataan yang benar adalah ....",o:["(1), (2), dan (3) saja","(1) dan (3) saja","(2), (3), dan (4) saja","(1), (2), dan (4) saja","(1), (2), (3), dan (4)"],a:3,e:"(1) Benar, sesuai tabel. (2) Benar.\n(3) Salah: 19 hanya nilai untuk $h=1$, bukan limit.\n(4) Benar: $\\frac{s(2+h)-s(2)}{h}=16+3h\\to16$.",h:"Cek pola kolom: kalau selisih terhadap suatu angka mengecil sepuluh kali lipat setiap $h$ dikecilkan, angka itulah limitnya. Nilai di kolom pertama biasanya jebakan."}]},
{t:3,ind:"Saya dapat menganalisis grafik kecepatan-waktu: arah gerak, titik balik, dan titik percepatan nol dengan turunan.",qs:[
{y:T,q:"Kecepatan sebuah robot $v(t)=t^2-8t+12$ m/s, $0\\le t\\le8$, ditunjukkan pada grafik.\n<svg viewBox='0 0 340 195' width='100%' style='max-width:460px' role='img' aria-label='Grafik kecepatan waktu robot v=t kuadrat min 8t plus 12'><g stroke='currentColor' fill='none' stroke-width='1.2'><path d='M40 10V178M40 120H334'/><path d='M112 30V170' stroke-dasharray='2 4' opacity='.3'/><path d='M184 30V170' stroke-dasharray='2 4' opacity='.3'/><path d='M256 30V170' stroke-dasharray='2 4' opacity='.3'/><polyline stroke='#0ca678' stroke-width='2.5' stroke-linejoin='round' points='40.0,24.0 49.0,39.5 58.0,54.0 67.0,67.5 76.0,80.0 85.0,91.5 94.0,102.0 103.0,111.5 112.0,120.0 121.0,127.5 130.0,134.0 139.0,139.5 148.0,144.0 157.0,147.5 166.0,150.0 175.0,151.5 184.0,152.0 193.0,151.5 202.0,150.0 211.0,147.5 220.0,144.0 229.0,139.5 238.0,134.0 247.0,127.5 256.0,120.0 265.0,111.5 274.0,102.0 283.0,91.5 292.0,80.0 301.0,67.5 310.0,54.0 319.0,39.5 328.0,24.0'/></g><circle cx='112' cy='120' r='3.5' fill='#c2352b'/><circle cx='256' cy='120' r='3.5' fill='#c2352b'/><circle cx='184' cy='152' r='3.5' fill='#3b5bdb'/><g fill='currentColor' font-size='10'><text x='14' y='124'>0</text><text x='12' y='28'>12</text><text x='12' y='156'>-4</text><text x='190' y='164' fill='#3b5bdb'>(4, -4)</text><text x='109' y='188'>2</text><text x='181' y='188'>4</text><text x='253' y='188'>6</text><text x='325' y='188'>8</text><text x='300' y='112'>t (s)</text><text x='46' y='20'>v (m/s)</text></g></svg>\nBerdasarkan grafik dan sifat turunan, pernyataan yang benar tentang gerak robot adalah ....",o:["Robot berbalik arah hanya pada $t=4$ s karena $a(4)=0$.","Robot berbalik arah pada $t=2$ s dan $t=6$ s, sedangkan percepatannya nol pada $t=4$ s saat kecepatannya paling negatif ($-4$ m/s).","Robot bergerak ke arah negatif pada $t<2$ s dan $t>6$ s.","Robot dipercepat sepanjang $0<t<4$ s karena grafik $v$-$t$ menurun.","Robot berhenti selamanya setelah $t=6$ s karena $v(6)=0$."],a:1,e:"$v=(t-2)(t-6)$, sehingga $v=0$ di $t=2$ dan $t=6$. Tanda $v$ berubah di titik itu, jadi robot berbalik arah.\n$a=v'=2t-8=0$ di $t=4$, dan $v(4)=-4$ m/s, yaitu kecepatan paling negatif (minimum).\nPilihan A keliru: $a=0$ bukan tanda berbalik arah. Pilihan C keliru: $v<0$ hanya di $2<t<6$.",h:"Berbalik arah = grafik $v$ memotong sumbu-$t$ dengan tanda berubah. Percepatan nol = puncak atau lembah grafik $v$, tepat di tengah dua akar: $\\frac{2+6}2=4$."},
{y:M,q:"Untuk robot yang sama dengan $v(t)=t^2-8t+12$, perhatikan pernyataan!\n(1) Pada $2<t<6$ robot bergerak mundur.\n(2) Percepatan robot $a(t)=t-4$.\n(3) Pada $0<t<2$ robot bergerak maju dan diperlambat.\n(4) Pada $t>6$ robot bergerak maju dan diperlambat.\nPernyataan yang benar adalah ....",o:["(1) dan (3) saja","(1), (2), dan (3) saja","(1), (3), dan (4) saja","(2) dan (4) saja","(1), (2), (3), dan (4)"],a:0,e:"(1) Benar: $v<0$ untuk $2<t<6$.\n(2) Salah: $a=v'=2t-8$.\n(3) Benar: $v>0$ dan $a<0$, sehingga diperlambat.\n(4) Salah: untuk $t>6$, $v>0$ dan $a>0$, sehingga dipercepat.",h:"Tanda $v$ dan $a$ sama berarti dipercepat; tandanya berbeda berarti diperlambat. Tanda $v$ menentukan arah gerak."}]},
{t:1,ind:"Saya dapat menganalisis grafik $f(\\beta)=\\frac{\\sin\\beta}{\\beta}$: keterdefinisian di nol dan nilai limit di nol dan di tak hingga.",qs:[
{y:T,q:"Amplitudo relatif pola difraksi cahaya dinyatakan $f(\\beta)=\\frac{\\sin\\beta}{\\beta}$. Grafiknya ditunjukkan di bawah (titik kosong di $\\beta=0$).\n<svg viewBox='0 0 340 190' width='100%' style='max-width:460px' role='img' aria-label='Grafik f(beta)=sin beta per beta, titik kosong di (0,1)'><g stroke='currentColor' fill='none' stroke-width='1.2'><path d='M170 12V170M8 140H332'/><path d='M42.8 30V168' stroke-dasharray='2 4' opacity='.35'/><path d='M85.2 30V168' stroke-dasharray='2 4' opacity='.35'/><path d='M127.6 30V168' stroke-dasharray='2 4' opacity='.35'/><path d='M212.4 30V168' stroke-dasharray='2 4' opacity='.35'/><path d='M254.8 30V168' stroke-dasharray='2 4' opacity='.35'/><path d='M297.2 30V168' stroke-dasharray='2 4' opacity='.35'/><polyline stroke='#7048e8' stroke-width='2.5' stroke-linejoin='round' points='168.0,40.4 164.6,42.6 159.2,50.3 153.8,62.3 148.4,77.5 143.0,94.5 137.6,111.9 132.2,128.0 126.8,141.8 121.4,152.3 116.0,158.9 110.6,161.6 105.2,160.8 99.8,157.0 94.4,151.3 89.0,144.7 83.6,138.2 78.2,132.7 72.8,129.0 67.4,127.3 62.0,127.6 56.6,129.8 51.2,133.4 45.8,137.6 40.4,141.8 35.0,145.4 29.6,148.0 24.2,149.1 18.8,148.7 13.4,147.1 8.0,144.5'/><polyline stroke='#7048e8' stroke-width='2.5' stroke-linejoin='round' points='172.0,40.4 175.4,42.6 180.8,50.3 186.2,62.3 191.6,77.5 197.0,94.5 202.4,111.9 207.8,128.0 213.2,141.8 218.6,152.3 224.0,158.9 229.4,161.6 234.8,160.8 240.2,157.0 245.6,151.3 251.0,144.7 256.4,138.2 261.8,132.7 267.2,129.0 272.6,127.3 278.0,127.6 283.4,129.8 288.8,133.4 294.2,137.6 299.6,141.8 305.0,145.4 310.4,148.0 315.8,149.1 321.2,148.7 326.6,147.1 332.0,144.5'/></g><circle cx='170' cy='40' r='4.5' fill='none' stroke='#c2352b' stroke-width='2'/><g fill='currentColor' font-size='10'><text x='154' y='44'>1</text><text x='176' y='154'>0</text><text x='300' y='132'>β (rad)</text><text x='176' y='20'>f(β)</text><text x='178' y='34' fill='#c2352b'>(0, 1) kosong</text><text x='34.8' y='182'>-3π</text><text x='77.2' y='182'>-2π</text><text x='119.6' y='182'>-π</text><text x='204.4' y='182'>π</text><text x='246.8' y='182'>2π</text><text x='289.2' y='182'>3π</text></g></svg>\nPernyataan yang benar tentang $f$ adalah ....",o:["$f$ tidak terdefinisi di $\\beta=0$, sehingga $\\lim_{\\beta\\to0}f(\\beta)$ tidak ada.","$f(0)=0$, sehingga grafik melalui titik asal.","$f$ tidak terdefinisi di $\\beta=0$, tetapi $\\lim_{\\beta\\to0}f(\\beta)=1$ (titik kosong di $(0,1)$).","$\\lim_{\\beta\\to\\infty}f(\\beta)=1$.","$\\lim_{\\beta\\to0}f(\\beta)=0$."],a:2,e:"Di $\\beta=0$, $f=\\frac00$ sehingga tidak terdefinisi (titik kosong), tetapi limit tetap ada: $\\lim_{\\beta\\to0}\\frac{\\sin\\beta}\\beta=1$.\nUntuk $\\beta\\to\\infty$: $|\\sin\\beta|\\le1$ sehingga $|f|\\le\\frac1\\beta\\to0$, bukan 1.",h:"Titik kosong pada grafik menunjukkan nilai limit (di sini 1), dan limit tidak mensyaratkan fungsi terdefinisi. Di tak hingga, pembilang terbatas dan penyebut membesar, jadi hasilnya 0."},
{r:1,y:T,q:"Fungsi $g(x)=\\frac{\\sin2x}{x}$ tidak terdefinisi di $x=0$. Pernyataan yang benar adalah ....",o:["$\\lim_{x\\to0}g(x)$ tidak ada.","$\\lim_{x\\to0}g(x)=1$.","$\\lim_{x\\to0}g(x)=2$, grafik berlubang di $(0,2)$.","$\\lim_{x\\to\\infty}g(x)=2$.","$g(0)=2$."],a:2,e:"$\\lim_{x\\to0}\\frac{\\sin2x}{x}=2$ sehingga grafik berlubang di $(0,2)$ dan $g(0)$ tidak terdefinisi. Untuk $x\\to\\infty$, $g\\to0$.",h:"$\\sin(ax)/x\\to a$ untuk $x\\to0$; titik kosong ada di ketinggian $a$."},
{y:M,q:"Untuk $f(\\beta)=\\frac{\\sin\\beta}{\\beta}$, perhatikan pernyataan!\n(1) $f$ tidak terdefinisi di $\\beta=0$.\n(2) $\\lim_{\\beta\\to0}\\frac{\\sin5\\beta}{5\\beta}=1$.\n(3) $\\lim_{\\beta\\to0}f(\\beta)=0$.\n(4) $\\lim_{\\beta\\to\\infty}f(\\beta)=0$.\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1), (2), dan (3) saja","(2), (3), dan (4) saja","(1), (3), dan (4) saja","(1), (2), dan (4) saja"],a:4,e:"(1) Benar: $\\frac00$. (2) Benar: bentuk baku $\\frac{\\sin u}{u}\\to1$ dengan $u=5\\beta\\to0$.\n(3) Salah: limitnya 1. (4) Benar: $|f|\\le\\frac1\\beta\\to0$.",h:"Bentuk $\\frac{\\sin(\\text{sesuatu})}{\\text{sesuatu yang sama}}$ selalu 1 saat 'sesuatu' menuju 0. Di tak hingga: terbatas dibagi membesar = 0."}]},
{t:2,ind:"Saya dapat menentukan laju perubahan (turunan) fungsi energi potensial polinom di suatu titik.",qs:[
{y:T,q:"Energi potensial sebuah sistem $U(x)=x^3-4x^2+5x$ joule, $x$ dalam meter. Laju perubahan $U$ terhadap $x$ pada $x=2$ adalah ....",o:["0 J/m","1 J/m","2 J/m","3 J/m","5 J/m"],a:1,e:"$U'(x)=3x^2-8x+5$. Di $x=2$: $12-16+5=1$ J/m.\nKeliru umum: 2 adalah nilai $U(2)=8-16+10$, bukan laju perubahan.",h:"Laju perubahan = turunan: pangkat turun, kalikan pangkat, lalu substitusi titiknya."},
{r:1,y:T,q:"Energi potensial $U(x)=2x^3-5x^2+3x$ joule. Laju perubahan $U$ terhadap $x$ pada $x=2$ adalah ....",o:["2 J/m","3 J/m","5 J/m","7 J/m","12 J/m"],a:3,e:"$U'=6x^2-10x+3$. Di $x=2$: $24-20+3=7$ J/m. ($U(2)=2$ bukan jawabannya.)",h:"Turunkan suku demi suku, lalu substitusi $x=2$."}]},
{t:2,ind:"Saya dapat menurunkan fungsi pecahan (konsentrasi) dengan aturan hasil bagi dan menghitung nilainya di suatu titik.",qs:[
{y:T,q:"Konsentrasi obat dalam darah $C(t)=\\frac{10t}{t^2+9}$ mg/L, $t$ dalam jam. Laju perubahan konsentrasi pada $t=1$ adalah ....",o:["0,2 mg/L per jam","0,8 mg/L per jam","1,0 mg/L per jam","8 mg/L per jam","10 mg/L per jam"],a:1,e:"Aturan hasil bagi: $C'=\\frac{10(t^2+9)-10t\\cdot2t}{(t^2+9)^2}=\\frac{10(9-t^2)}{(t^2+9)^2}$.\nDi $t=1$: $\\frac{10\\cdot8}{100}=0{,}8$.\nKeliru umum: menurunkan pembilang dan penyebut masing-masing.",h:"$\\left(\\frac uv\\right)'=\\frac{u'v-uv'}{v^2}$. Pembilang: 'turunkan atas kali bawah, kurangi atas kali turunan bawah'."},
{r:1,y:T,q:"Konsentrasi $C(t)=\\frac{6t}{t^2+4}$ mg/L. Laju perubahan konsentrasi pada $t=1$ adalah ....",o:["0,6","0,72","0,9","1,2","18"],a:1,e:"$C'=\\frac{6(t^2+4)-6t\\cdot2t}{(t^2+4)^2}=\\frac{6(4-t^2)}{(t^2+4)^2}$. Di $t=1$: $\\frac{18}{25}=0{,}72$.",h:"Untuk $\\frac{kt}{t^2+a^2}$: $C'=\\frac{k(a^2-t^2)}{(t^2+a^2)^2}$."}]},
{t:3,ind:"Saya dapat mengevaluasi pernyataan tentang domain, titik ekstrem, dan jenis ekstrem pada model volume kotak dengan uji turunan.",qs:[
{y:M,q:"Volume kotak dari karton 18 cm $\\times$ 18 cm dimodelkan $V(x)=x(18-2x)^2$ dengan $x$ sisi potongan. Perhatikan pernyataan!\n(1) Domain yang masuk akal adalah $0<x<9$.\n(2) Titik stasioner di $x=3$ dan $x=9$.\n(3) $x=9$ memberi volume maksimum.\n(4) $x=3$ memberi volume maksimum 432 cm³.\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1), (2), dan (4) saja","(2), (3), dan (4) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:1,e:"$V'=(18-2x)(18-6x)=0\\Rightarrow x=9$ atau $x=3$ (2 benar). Alas harus positif: $0<x<9$ (1 benar).\n$V'$ berubah $+\\to-$ di $x=3$ dan $V(3)=3\\cdot12^2=432$ (4 benar).\n(3) Salah: $x=9$ di batas domain dengan $V=0$.",h:"Titik ekstrem harus berada di dalam domain. Nilai $V=0$ di ujung domain tidak mungkin maksimum."},
{r:1,y:M,q:"Model volume kotak dari karton 24 cm $\\times$ 24 cm: $V(x)=x(24-2x)^2$. Perhatikan pernyataan!\n(1) Domain yang masuk akal $0<x<12$.\n(2) $V'$ berubah dari positif ke negatif di $x=4$.\n(3) $x=12$ memberi volume maksimum.\n(4) $V(4)=1.024$ cm³ adalah maksimum.\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1), (3), dan (4) saja","(2), (3), dan (4) saja","(1), (2), dan (4) saja","(1), (2), (3), dan (4)"],a:3,e:"$V'=(24-2x)(24-6x)$, akar 12 dan 4. (1), (2), (4) benar. (3) Salah: di $x=12$, $V=0$.",h:"Uji tanda $V'$ di kiri dan kanan titik stasioner, dan buang titik di luar domain."}]},
{t:3,ind:"Saya dapat mengevaluasi kesimpulan teknisi dari model daya dan tabel data dengan turunan.",qs:[
{y:T,q:"Daya sebuah perangkat $P(x)=-2x^2+24x$ watt dengan tegangan $x$ volt. Data uji:<table style='border-collapse:collapse;margin:6px 0;font-size:.9rem'><tr><td style='border:1px solid #999;padding:3px 9px'>$x$ (V)</td><td style='border:1px solid #999;padding:3px 9px'>4</td><td style='border:1px solid #999;padding:3px 9px'>5</td><td style='border:1px solid #999;padding:3px 9px'>6</td><td style='border:1px solid #999;padding:3px 9px'>7</td><td style='border:1px solid #999;padding:3px 9px'>8</td></tr><tr><td style='border:1px solid #999;padding:3px 9px'>$P$ (W)</td><td style='border:1px solid #999;padding:3px 9px'>64</td><td style='border:1px solid #999;padding:3px 9px'>70</td><td style='border:1px solid #999;padding:3px 9px'>72</td><td style='border:1px solid #999;padding:3px 9px'>70</td><td style='border:1px solid #999;padding:3px 9px'>64</td></tr></table>Teknisi menyimpulkan: \"Makin besar tegangan, makin besar daya, jadi gunakan 8 V.\" Evaluasi yang tepat adalah ....",o:["Benar, karena daya terus naik sampai 8 V.","Salah, karena $P'(8)=-8<0$ (daya turun di 8 V); daya maksimum 72 W dicapai pada $x=6$ V.","Salah, karena daya maksimum 70 W dicapai pada $x=5$ V.","Benar, karena $P(8)>P(4)$.","Tidak dapat dievaluasi karena data kurang."],a:1,e:"$P'=-4x+24=0\\Rightarrow x=6$, $P''=-4<0$ sehingga maksimum, $P(6)=72$ W.\nDi $x=8$: $P'(8)=-8<0$, daya sedang turun, dan data menunjukkan $P(8)=64<72$.\nKesimpulan teknisi keliru.",h:"Cocokkan data dengan turunan: titik tertinggi pada tabel harus sama dengan akar $P'$. Jika berbeda dengan klaim, klaim itu keliru."},
{r:1,y:T,q:"Daya $P(x)=-x^2+10x$ watt. Data: $x=3,4,5,6,7$ memberi $P=21,24,25,24,21$ W. Teknisi menyimpulkan: \"Gunakan tegangan terbesar, 7 V.\" Evaluasi yang tepat adalah ....",o:["Benar, karena 7 V adalah data terbesar.","Benar, karena $P(7)>0$.","Salah, karena $P'(x)=-2x+10=0$ di $x=5$ dan $P(5)=25$ W adalah maksimum.","Salah, karena maksimum di $x=6$ V.","Tidak dapat dievaluasi."],a:2,e:"$P'=-2x+10=0\\Rightarrow x=5$; $P''=-2<0$; $P(5)=25$. Pada 7 V daya hanya 21 W.",h:"Daya kuadrat terbuka ke bawah: maksimum di tengah dua nilai yang dayanya sama (4 dan 6 memberi 24)."}]},
{t:3,ind:"Saya dapat menganalisis tanda turunan pertama untuk menentukan interval naik dan nilai maksimum model daya.",qs:[
{y:M,q:"Daya baterai $P(t)=-3t^2+18t$ watt, $0\\le t\\le8$ jam. Perhatikan pernyataan!\n(1) $P'(t)=-6t+18$\n(2) $P$ naik pada $0<t<3$\n(3) Nilai maksimum $P$ adalah 54 W\n(4) $P'(3)=0$\nPernyataan yang benar adalah ....",o:["(1), (3), dan (4) saja","(1) dan (2) saja","(2), (3), dan (4) saja","(1), (2), dan (4) saja","(1), (2), (3), dan (4)"],a:3,e:"(1) benar. $P'>0$ untuk $t<3$ sehingga $P$ naik (2 benar). $P'(3)=0$ (4 benar).\n(3) Salah: $P(3)=-27+54=27$ W.",h:"Maksimum di akar $P'$; masukkan akar itu ke $P$, jangan ke $P'$."},
{r:1,y:M,q:"Daya $P(t)=-2t^2+16t$ watt. Perhatikan pernyataan!\n(1) $P'(t)=-4t+16$\n(2) $P$ naik pada $0<t<4$\n(3) Nilai maksimum $P$ adalah 64 W\n(4) Maksimum $P(4)=32$ W\nPernyataan yang benar adalah ....",o:["(1), (2), dan (4) saja","(1) dan (2) saja","(2), (3), dan (4) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:0,e:"(1), (2), (4) benar: $P(4)=-32+64=32$. (3) Salah.",h:"Akar $P'$ adalah $t=4$; nilai maksimum $P(4)=32$."}]},
{t:3,ind:"Saya dapat mengevaluasi desain kaleng yang paling hemat bahan dengan turunan dan perhitungan luas.",qs:[
{y:T,q:"Kaleng tertutup berbentuk tabung bervolume $54\\pi$ cm³ dimodelkan $A(r)=2\\pi r^2+\\frac{108\\pi}{r}$. Tiga desain:<table style='border-collapse:collapse;margin:6px 0;font-size:.9rem'><tr><td style='border:1px solid #999;padding:3px 9px'>Desain</td><td style='border:1px solid #999;padding:3px 9px'>$r$ (cm)</td><td style='border:1px solid #999;padding:3px 9px'>$h$ (cm)</td></tr><tr><td style='border:1px solid #999;padding:3px 9px'>X</td><td style='border:1px solid #999;padding:3px 9px'>2</td><td style='border:1px solid #999;padding:3px 9px'>13,5</td></tr><tr><td style='border:1px solid #999;padding:3px 9px'>Y</td><td style='border:1px solid #999;padding:3px 9px'>3</td><td style='border:1px solid #999;padding:3px 9px'>6</td></tr><tr><td style='border:1px solid #999;padding:3px 9px'>Z</td><td style='border:1px solid #999;padding:3px 9px'>4</td><td style='border:1px solid #999;padding:3px 9px'>3,375</td></tr></table>Desain yang paling hemat bahan adalah ....",o:["X, karena jari-jarinya paling kecil.","Y, karena $A'(3)=0$, $A''>0$, dan $A(3)=54\\pi$ cm² paling kecil.","Z, karena tingginya paling kecil.","X dan Z sama hemat.","Tidak dapat ditentukan."],a:1,e:"$A'=4\\pi r-\\frac{108\\pi}{r^2}=0\\Rightarrow r^3=27$, $r=3$ dan $A''>0$ (minimum).\n$A(2)=8\\pi+54\\pi=62\\pi$, $A(3)=18\\pi+36\\pi=54\\pi$, $A(4)=32\\pi+27\\pi=59\\pi$.\nDesain Y paling hemat.",h:"Kaleng tertutup paling hemat saat $h=2r$ (tinggi sama dengan diameter). Desain mana yang $h=2r$? Y: $6=2\\times3$."},
{r:1,y:T,q:"Kaleng tertutup bervolume $128\\pi$ cm³ dengan $A(r)=2\\pi r^2+\\frac{256\\pi}{r}$. Desain P: $r=2,h=32$; Q: $r=4,h=8$; R: $r=8,h=2$. Desain paling hemat adalah ....",o:["P, karena jari-jarinya kecil.","R, karena tingginya kecil.","P dan R sama hemat.","Tidak dapat ditentukan.","Q, karena $A'(4)=0$ dan $A(4)=96\\pi$ cm² terkecil."],a:4,e:"$A'=0\\Rightarrow r^3=64$, $r=4$. $A(2)=136\\pi$, $A(4)=96\\pi$, $A(8)=160\\pi$.",h:"$h=2r$: Q memenuhi ($8=2\\times4$)."}]},
{t:3,ind:"Saya dapat mengevaluasi klaim sudut optimum pada model jangkauan lemparan berbentuk fungsi trigonometri.",qs:[
{y:M,q:"Jangkauan lemparan $R(\\theta)=40\\sin2\\theta$ meter, $0<\\theta<90^\\circ$. Seorang atlet mengklaim jangkauan maksimum tercapai pada $\\theta=60^\\circ$. Perhatikan pernyataan!\n(1) $R'(\\theta)=80\\cos2\\theta$\n(2) $\\theta=45^\\circ$ adalah titik stasioner\n(3) $R(60^\\circ)=20\\sqrt3\\approx34{,}6$ m, lebih kecil daripada $R(45^\\circ)=40$ m\n(4) Klaim atlet benar\nPernyataan yang benar adalah ....",o:["(1) dan (4) saja","(2), (3), dan (4) saja","(1), (2), dan (3) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:2,e:"$R'=80\\cos2\\theta=0\\Rightarrow2\\theta=90^\\circ$, $\\theta=45^\\circ$ (1 dan 2 benar). $R''=-160\\sin2\\theta<0$ di $45^\\circ$ sehingga maksimum, $R=40$ m.\n(3) Benar: $40\\sin120^\\circ=20\\sqrt3$. (4) Salah.",h:"$\\sin2\\theta$ maksimum saat $2\\theta=90^\\circ$, jadi sudut lemparan optimum selalu $45^\\circ$ (di tanah datar)."},
{r:1,y:M,q:"Jangkauan $R(\\theta)=50\\sin2\\theta$ meter. Atlet mengklaim maksimum pada $\\theta=30^\\circ$. Perhatikan pernyataan!\n(1) $R'(\\theta)=100\\cos2\\theta$\n(2) $\\theta=45^\\circ$ adalah titik stasioner\n(3) $R(30^\\circ)=25\\sqrt3\\approx43{,}3$ m, lebih kecil daripada $R(45^\\circ)=50$ m\n(4) Klaim atlet benar\nPernyataan yang benar adalah ....",o:["(1), (2), dan (3) saja","(1) dan (4) saja","(2), (3), dan (4) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:0,e:"(1)(2)(3) benar. (4) Salah: maksimum 50 m di $45^\\circ$.",h:"Sudut optimum selalu $45^\\circ$."}]},
{t:1,ind:"Saya dapat menguraikan penyelesaian soal debit pompa: nilai awal, limit tak hingga, dan waktu mencapai persentase tertentu dari limit.",qs:[
{y:E,q:"Debit sebuah pompa $Q(t)=\\frac{60t}{t+4}$ liter/menit, $t$ dalam menit.\na. Tentukan debit awal $Q(0)$.\nb. Tentukan $\\lim_{t\\to\\infty}Q(t)$ dan artikan hasilnya.\nc. Tentukan waktu agar debit mencapai 75% dari nilai limit.",e:"a. $Q(0)=\\frac{0}{4}=0$ liter/menit.\nb. $\\lim\\frac{60t}{t+4}=\\lim\\frac{60}{1+4/t}=60$. Debit mendekati 60 L/menit (asimtot datar $Q=60$), tidak pernah tepat 60.\nc. $75\\%\\times60=45$. $\\frac{60t}{t+4}=45\\Rightarrow60t=45t+180\\Rightarrow t=12$ menit.",h:"Bentuk $\\frac{Lt}{t+a}$: debit pada persentase $f$ dari limit tercapai saat $t=a\\cdot\\frac f{1-f}=4\\cdot\\frac{0{,}75}{0{,}25}=12$."},
{r:1,y:E,q:"Debit pompa $Q(t)=\\frac{80t}{t+5}$ liter/menit.\na. Tentukan $Q(0)$.\nb. Tentukan $\\lim_{t\\to\\infty}Q(t)$.\nc. Tentukan waktu agar debit mencapai 60% dari nilai limit.",e:"a. $Q(0)=0$. b. Limit $=80$. c. $60\\%\\times80=48$; $80t=48t+240\\Rightarrow t=7{,}5$ menit.",h:"$t=a\\cdot\\frac f{1-f}=5\\cdot\\frac{0{,}6}{0{,}4}=7{,}5$."}]},
{t:2,ind:"Saya dapat menguraikan penyelesaian soal simpangan sinusoidal: kecepatan, percepatan, hubungan $a=-\\omega^2y$, dan saat berhenti sesaat.",qs:[
{y:E,q:"Simpangan sebuah beban pegas $y(t)=4\\sin3t$ cm, $0\\le t\\le\\frac{2\\pi}3$ s.\na. Tentukan kecepatan $v(t)$ dan percepatan $a(t)$.\nb. Tunjukkan bahwa $a=-\\omega^2y$ dan tentukan $\\omega$.\nc. Tentukan saat beban berhenti sesaat pada selang tersebut dan simpangannya.",e:"a. $v=y'=12\\cos3t$, $a=v'=-36\\sin3t$.\nb. $a=-36\\sin3t=-9(4\\sin3t)=-9y$, jadi $\\omega^2=9$ dan $\\omega=3$ rad/s.\nc. $v=0\\Rightarrow\\cos3t=0\\Rightarrow3t=\\frac\\pi2$ atau $\\frac{3\\pi}2$, sehingga $t=\\frac\\pi6$ s dan $t=\\frac\\pi2$ s. Simpangan: $y=4$ cm dan $y=-4$ cm (simpangan terjauh).",h:"Berhenti sesaat = simpangan maksimum (amplitudo): $y=\\pm A$ dan percepatannya maksimum. Koefisien di depan $y$ pada $a=-\\omega^2y$ langsung memberi $\\omega^2$."},
{r:1,y:E,q:"Simpangan $y(t)=5\\sin2t$ cm, $0\\le t\\le\\pi$ s.\na. Tentukan $v(t)$ dan $a(t)$.\nb. Tunjukkan $a=-\\omega^2y$ dan tentukan $\\omega$.\nc. Tentukan saat beban berhenti sesaat dan simpangannya.",e:"a. $v=10\\cos2t$, $a=-20\\sin2t$. b. $a=-4y$, $\\omega=2$ rad/s. c. $v=0\\Rightarrow2t=\\frac\\pi2,\\frac{3\\pi}2$, $t=\\frac\\pi4$ dan $\\frac{3\\pi}4$; $y=5$ dan $-5$ cm.",h:"Berhenti sesaat pada $y=\\pm A$."}]},
{t:3,ind:"Saya dapat menguraikan analisis fungsi lintasan polinom dari grafiknya: interval naik atau turun, titik stasioner, jenis ekstrem, dan titik belok.",qs:[
{y:E,q:"Lintasan sebuah benda $s(t)=t^3-6t^2+9t-2$ meter. Grafiknya ditunjukkan di bawah.\n<svg viewBox='0 0 300 170' width='100%' style='max-width:440px' role='img' aria-label='Grafik lintasan s(t)=t pangkat 3 min 6t kuadrat plus 9t min 2'><g stroke='currentColor' fill='none' stroke-width='1.2'><path d='M40 10V160M40 100H290'/><path d='M100 20V150M220 20V150' stroke-dasharray='2 4' opacity='.3'/><polyline stroke='#7048e8' stroke-width='2.5' stroke-linejoin='round' points='40.0,140.0 55.0,102.2 70.0,77.5 85.0,64.1 100.0,60.0 115.0,63.4 130.0,72.5 145.0,85.3 160.0,100.0 175.0,114.7 190.0,127.5 205.0,136.6 220.0,140.0 235.0,135.9 250.0,122.5 265.0,97.8 280.0,60.0'/></g><circle cx='100' cy='60' r='3.5' fill='#c2352b'/><circle cx='220' cy='140' r='3.5' fill='#3b5bdb'/><circle cx='160' cy='100' r='3.5' fill='#0ca678'/><g fill='currentColor' font-size='10'><text x='106' y='56'>(1; 2)</text><text x='224' y='136'>(3; -2)</text><text x='164' y='94'>(2; 0)</text><text x='96' y='114'>1</text><text x='156' y='114'>2</text><text x='216' y='114'>3</text><text x='276' y='114'>t (s)</text><text x='46' y='16'>s (m)</text></g></svg>\na. Tentukan interval $s$ naik dan turun.\nb. Tentukan titik stasioner beserta jenis ekstremnya dengan uji turunan kedua.\nc. Tentukan titik belok dan jelaskan perubahan kecekungannya.",e:"a. $s'=3t^2-12t+9=3(t-1)(t-3)$. Naik: $t<1$ atau $t>3$. Turun: $1<t<3$.\nb. Stasioner di $t=1$ dan $t=3$. $s''=6t-12$: $s''(1)=-6<0$ sehingga maksimum lokal $(1;2)$; $s''(3)=6>0$ sehingga minimum lokal $(3;-2)$.\nc. $s''=0\\Rightarrow t=2$, $s(2)=0$. Titik belok $(2;0)$: cekung ke bawah untuk $t<2$ dan cekung ke atas untuk $t>2$ (kurva sesuai grafik).",h:"Pada kubik, titik belok tepat di tengah dua titik stasioner: $\\frac{1+3}2=2$, dan tinggi titik belok adalah rata-rata kedua ekstrem: $\\frac{2+(-2)}2=0$."},
{r:1,y:E,q:"Lintasan $s(t)=t^3-9t^2+24t-16$ meter.\na. Tentukan interval $s$ naik dan turun.\nb. Tentukan titik stasioner beserta jenisnya dengan uji turunan kedua.\nc. Tentukan titik belok.",e:"a. $s'=3(t-2)(t-4)$. Naik: $t<2$ atau $t>4$. Turun: $2<t<4$.\nb. $s''=6t-18$: $s''(2)=-6<0$ maksimum lokal $(2;4)$; $s''(4)=6>0$ minimum lokal $(4;0)$.\nc. $s''=0\\Rightarrow t=3$, $s(3)=2$. Titik belok $(3;2)$.",h:"Titik belok di tengah dua ekstrem: $t=\\frac{2+4}2=3$, $s=\\frac{4+0}2=2$."}]}
];

P(0,1,{q:"Posisi $s(t)=7t^2-2t$ meter. Kecepatan sesaat pada $t=2$ s adalah ....",o:["12 m/s","24 m/s","26 m/s","28 m/s","30 m/s"],a:2,e:"$s(2+h)-s(2)=7(4+4h+h^2)-2(2+h)-24=26h+7h^2$. Dibagi $h$ lalu $h\\to0$: 26 m/s. (24 adalah posisi $s(2)$.)",h:"$v=14t-2$; di $t=2$ hasilnya 26."});

P(5,1,{q:"$y(t)=4\\cos3t$ cm. Kecepatan pada $t=\\frac\\pi6$ s adalah ....",o:["$-12$ cm/s","$-4$ cm/s","0 cm/s","4 cm/s","12 cm/s"],a:0,e:"$v=-12\\sin3t$. Di $t=\\frac\\pi6$: $\\sin\\frac\\pi2=1$, sehingga $v=-12$ cm/s.",h:"$\\cos$ menjadi $-\\sin$; kalikan koefisien dalam: $-(4)(3)$."});

P(7,1,{q:"Untuk $s(t)=t^3-12t^2+36t$, percepatan saat benda pertama kali berhenti sesaat adalah ....",o:["$-24$ m/s²","$-12$ m/s²","0 m/s²","12 m/s²","24 m/s²"],a:1,e:"$v=3(t-2)(t-6)$, pertama berhenti di $t=2$. $a=6t-24$, $a(2)=-12$ m/s².",h:"Cari akar $v$ terkecil, masukkan ke $a=v'$."});

P2(3,1,M,{q:"Diketahui $f(x)=\\sqrt{x^2+10x}-x$. Perhatikan pernyataan!\n(1) $\\lim_{x\\to\\infty}f(x)=5$\n(2) $f(x)=\\frac{10x}{\\sqrt{x^2+10x}+x}$\n(3) $\\lim_{x\\to\\infty}f(x)=0$\n(4) $\\lim_{x\\to\\infty}f(x)=\\infty$\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1) dan (3) saja","(2) dan (4) saja","(1), (2), dan (3) saja","(3) dan (4) saja"],a:0,e:"Kalikan sekawan: $f(x)=\\frac{10x}{\\sqrt{x^2+10x}+x}$ (2 benar). Bagi $x$: $\\frac{10}{\\sqrt{1+10/x}+1}\\to5$ (1 benar). (3) dan (4) salah.",h:"$\\sqrt{x^2+px}-x\\to\\frac p2=5$."});
P2(3,0,M,{q:"Perhatikan pernyataan berikut!\n(1) $\\lim_{x\\to4}\\frac{x^2-16}{x-4}=8$\n(2) Bentuk $\\frac\\infty\\infty$ selalu bernilai 1.\n(3) $\\lim_{x\\to\\infty}\\frac{7x^2+3}{x^2+1}=7$\n(4) $\\lim_{x\\to0}\\frac{\\sin4x}{x}=4$\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1) dan (3) saja","(2) dan (4) saja","(1), (3), dan (4) saja","(1), (2), (3), dan (4)"],a:3,e:"(1) $x+4\\to8$, benar. (2) Salah: $\\frac\\infty\\infty$ bentuk tak tentu. (3) Benar: $\\frac71$. (4) Benar: $\\sin ax/x\\to a$.",h:"Faktorkan untuk $\\frac00$; rasio koefisien depan untuk $\\frac\\infty\\infty$; $\\sin ax/x=a$."});
P2(6,1,M,{q:"Diketahui $f(x)=\\frac{x}{x^2+4}$ dengan $f'(x)=\\frac{4-x^2}{(x^2+4)^2}$. Perhatikan pernyataan!\n(1) $f'(0)=\\frac14$\n(2) $f'(2)=0$\n(3) $f'(1)=\\frac3{25}$\n(4) $f'(3)=\\frac5{169}$\nPernyataan yang benar adalah ....",o:["(1) saja","(1), (2), dan (3) saja","(1) dan (2) saja","(2) dan (4) saja","(3) dan (4) saja"],a:1,e:"(1) $\\frac4{16}=\\frac14$ benar. (2) benar. (3) $\\frac3{25}$ benar. (4) Salah: $f'(3)=\\frac{-5}{169}$.",h:"Cek tanda pembilang $4-x^2$: positif jika $|x|<2$, nol di 2, negatif jika $|x|>2$."});
P2(6,0,M,{q:"Simpangan $y(t)=4\\sin3t$. Perhatikan pernyataan!\n(1) $v=12\\cos3t$\n(2) $a=-36\\sin3t$\n(3) Kecepatan maksimum adalah 4\n(4) $a=-9y$\nPernyataan yang benar adalah ....",o:["(1), (2), dan (3) saja","(1), (2), dan (4) saja","(2), (3), dan (4) saja","(1) dan (3) saja","(1), (2), (3), dan (4)"],a:1,e:"(1) dan (2) benar. (3) Salah: $v_{maks}=A\\omega=12$. (4) Benar: $a=-36\\sin3t=-9(4\\sin3t)$.",h:"$y=A\\sin\\omega t$: $v_{maks}=A\\omega$ dan $a=-\\omega^2y$."});
P2(11,1,M,{q:"Diketahui $f(x)=x^3-12x$. Perhatikan pernyataan!\n(1) $f'(x)=3x^2-12$\n(2) Titik stasioner di $x=-2$ dan $x=2$\n(3) $x=-2$ memberi maksimum lokal bernilai 16\n(4) $x=2$ memberi maksimum lokal\nPernyataan yang benar adalah ....",o:O1,a:1,e:"(1) dan (2) benar: $3(x-2)(x+2)=0$. (3) $f(-2)=-8+24=16$, $f'$ berubah $+\\to-$, benar. (4) Salah: $x=2$ minimum lokal, $f(2)=-16$.",h:"Kubik berkoefisien depan positif: maksimum lokal di akar kiri, minimum lokal di akar kanan."});
P2(13,0,T,{q:"Suhu air didinginkan menurut $T(t)=10+\\frac{30}{t+2}$ °C. Grafik $T$ menurun dan mendekati garis putus-putus $T=10$. Kesimpulan yang tepat adalah ....",o:["Suhu menjadi 0 °C untuk waktu yang sangat lama.","Suhu tepat 10 °C pada $t=28$ menit.","Suhu mendekati 10 °C tetapi tidak pernah tepat 10 °C; $T=10$ adalah asimtot datar.","Suhu kembali mendekati 25 °C.","Suhu mendekati 2 °C."],a:2,e:"$\\lim\\frac{30}{t+2}=0$ sehingga $T\\to10$, dan $T>10$ untuk semua $t$.",h:"Konstanta + pecahan: limit tak hingga adalah konstantanya."});
P2(14,0,T,{q:"Gerobak bergerak dengan $s(t)=t^2$ meter. Garis singgung di $P(2\\text{ s};4\\text{ m})$ memotong sumbu-$t$ di $t=1$ s. Pernyataan yang tepat adalah ....",o:["Kecepatan sesaat di $P$ adalah 4 m/s, dua kali kecepatan rata-rata 0 sampai 2 s.","Kecepatan sesaat di $P$ adalah 2 m/s, sama dengan kecepatan rata-rata 0 sampai 2 s.","Kecepatan sesaat di $P$ adalah 4 m/s karena posisi di $P$ adalah 4 m.","Kecepatan sesaat di $P$ adalah 2 m/s, setengah kecepatan rata-rata 0 sampai 2 s.","Kecepatan sesaat di $P$ adalah 3 m/s, 1,5 kali kecepatan rata-rata 0 sampai 2 s."],a:0,e:"Gradien singgung $=\\frac{4-0}{2-1}=4$ m/s. Kecepatan rata-rata 0 sampai 2 s $=\\frac42=2$ m/s. Jadi 4 adalah dua kali 2.",h:"Untuk $s=at^2$ dari nol, kecepatan sesaat selalu 2 kali kecepatan rata-rata."});
P2(15,1,M,{q:"Empat siswa menyelesaikan limit berikut.\nSiswa A: $\\lim_{x\\to3}\\frac{x^2-9}{x-3}=6$.\nSiswa B: $\\lim_{x\\to0}\\frac{\\sin5x}{x}=1$.\nSiswa C: $\\lim_{x\\to\\infty}\\frac{2x+1}{x^2+1}=\\infty$.\nSiswa D: $\\lim_{x\\to\\infty}\\frac{2x+1}{x^2+1}=0$.\n(1) Siswa A benar.\n(2) Siswa B keliru; hasil yang benar 5.\n(3) Siswa C keliru; penyebut tumbuh lebih cepat.\n(4) Siswa D keliru.\nPenilaian yang tepat adalah ....",o:["(1) dan (4) saja","(2) dan (3) saja","(1), (2), dan (4) saja","(1), (2), dan (3) saja","(1), (2), (3), dan (4)"],a:3,e:"A benar ($x+3\\to6$). B keliru: $\\lim\\frac{\\sin5x}x=5$. C keliru: pangkat penyebut lebih besar, limit 0. D benar, jadi (4) salah.",h:"Bandingkan pangkat tertinggi: pembilang < penyebut menghasilkan 0."});
P2(15,0,T,{q:"Siswa menurunkan $f(x)=x\\sin2x$.\nLangkah 1: $u=x$, $v=\\sin2x$, $f'=u'v+uv'$.\nLangkah 2: $u'=1$ dan $v'=\\cos2x$.\nLangkah 3: $f'(x)=\\sin2x+x\\cos2x$.\nBagian yang keliru adalah ....",o:["Langkah 1, karena seharusnya $u'v'$.","Langkah 3, karena penjumlahan menjadi pengurangan.","Langkah 2, karena $v'=2\\cos2x$ (lupa mengalikan turunan bagian dalam).","Tidak ada kesalahan.","Langkah 1 dan Langkah 2."],a:2,e:"Aturan hasil kali benar, tetapi $\\frac d{dx}\\sin2x=2\\cos2x$. Hasil benar: $f'=\\sin2x+2x\\cos2x$.",h:"Setiap turunan fungsi trigonometri dengan sudut $kx$ harus dikalikan $k$."});
P2(16,0,T,{q:"Posisi $s(t)=3t^2+t$ meter. Kecepatan rata-rata pada $[2,2+h]$: untuk $h=1$; 0,1; 0,01; 0,001 diperoleh 16; 13,3; 13,03; 13,003 m/s. Kecepatan sesaat pada $t=2$ s mendekati ....",o:["3 m/s","13 m/s","16 m/s","19 m/s","26 m/s"],a:1,e:"Nilai-nilai itu mengikuti pola $13+3h$, sehingga limitnya 13 m/s.",h:"Lihat baris dengan $h$ paling kecil."});
P2(16,2,M,{q:"Posisi $s(t)=2t^2+6t$ meter. Kecepatan rata-rata pada $[1,1+h]$ untuk $h=1$; 0,1; 0,01; 0,001 adalah 12; 10,2; 10,02; 10,002 m/s. Perhatikan pernyataan!\n(1) Pada $h=0,1$ kecepatan rata-rata 10,2 m/s.\n(2) Makin kecil $h$, nilainya makin mendekati 10 m/s.\n(3) Limitnya sama dengan 12 m/s.\n(4) $v=10+2h$ sehingga limitnya 10 m/s.\nPernyataan yang benar adalah ....",o:["(1), (2), dan (3) saja","(1) dan (3) saja","(2), (3), dan (4) saja","(1), (2), dan (4) saja","(1), (2), (3), dan (4)"],a:3,e:"(1), (2), (4) benar. (3) Salah: 12 hanya untuk $h=1$.",h:"Kolom pertama ($h$ besar) adalah jebakan."});
P2(17,1,M,{q:"Robot dengan $v(t)=t^2-6t+8$ m/s. Perhatikan pernyataan!\n(1) Pada $2<t<4$ robot bergerak mundur.\n(2) Percepatan $a(t)=t-3$.\n(3) Pada $0<t<2$ robot bergerak maju dan diperlambat.\n(4) Pada $t>4$ robot bergerak maju dan diperlambat.\nPernyataan yang benar adalah ....",o:["(1) dan (3) saja","(1), (2), dan (3) saja","(1), (3), dan (4) saja","(2) dan (4) saja","(1), (2), (3), dan (4)"],a:0,e:"$v=(t-2)(t-4)$, $a=2t-6$. (1) Benar. (2) Salah. (3) Benar: $v>0$, $a<0$. (4) Salah: $v>0$ dan $a>0$ (dipercepat).",h:"Tanda $v$ dan $a$ sama: dipercepat; berbeda: diperlambat."});
P2(17,0,T,{q:"Kecepatan robot $v(t)=t^2-6t+8$ m/s. Pernyataan yang benar adalah ....",o:["Robot berbalik arah hanya pada $t=3$ s karena $a(3)=0$.","Robot berbalik arah pada $t=2$ s dan $t=4$ s; percepatannya nol pada $t=3$ s saat kecepatannya paling negatif ($-1$ m/s).","Robot bergerak ke arah negatif pada $t<2$ s dan $t>4$ s.","Robot dipercepat sepanjang $0<t<3$ s.","Robot berhenti selamanya setelah $t=4$ s."],a:1,e:"$v=(t-2)(t-4)$ berganti tanda di $t=2$ dan $t=4$. $a=2t-6=0$ di $t=3$, $v(3)=-1$.",h:"Percepatan nol di tengah dua akar: $\\frac{2+4}2=3$."});
P2(18,2,M,{q:"Untuk $g(x)=\\frac{\\sin3x}{x}$, perhatikan pernyataan!\n(1) $g$ tidak terdefinisi di $x=0$.\n(2) $\\lim_{x\\to0}g(x)=3$.\n(3) $\\lim_{x\\to\\infty}g(x)=3$.\n(4) $\\lim_{x\\to\\infty}g(x)=0$.\nPernyataan yang benar adalah ....",o:["(1) dan (2) saja","(1), (2), dan (3) saja","(2), (3), dan (4) saja","(1), (3), dan (4) saja","(1), (2), dan (4) saja"],a:4,e:"(1), (2), (4) benar. (3) Salah: $|g|\\le\\frac1x\\to0$.",h:"Di nol: $\\sin ax/x\\to a$. Di tak hingga: terbatas dibagi membesar = 0."});
P2(10,1,E,{q:"Seutas kawat 60 m dibentuk menjadi persegi panjang.\na. Susun fungsi luas $L(x)$ dengan $x$ sebagai panjang.\nb. Tentukan ukuran yang membuat luas maksimum dan buktikan itu maksimum.\nc. Berapa luas maksimumnya?",e:"a. Lebar $=30-x$, $L(x)=30x-x^2$.\nb. $L'=30-2x=0\\Rightarrow x=15$. $L''=-2<0$, jadi maksimum. Ukuran $15\\times15$ m.\nc. $L_{maks}=225$ m².",h:"Keliling tetap: luas maksimum saat persegi, sisi $=\\frac{60}4=15$."});
P2(10,0,E,{q:"Diketahui $f(x)=x^3-3x^2-9x+2$.\na. Tentukan interval $f$ naik dan turun.\nb. Tentukan titik stasioner beserta jenisnya.\nc. Tentukan titik belok.",e:"a. $f'=3x^2-6x-9=3(x-3)(x+1)$. Naik: $x<-1$ atau $x>3$. Turun: $-1<x<3$.\nb. $f(-1)=7$ (maksimum lokal, $f'$ berubah $+\\to-$) dan $f(3)=-25$ (minimum lokal, $-\\to+$).\nc. $f''=6x-6=0\\Rightarrow x=1$, $f(1)=-9$. Titik belok $(1,-9)$.",h:"Titik belok pada kubik tepat di tengah dua titik stasioner: $\\frac{-1+3}2=1$."});
P2(12,1,E,{q:"Bak air tanpa tutup beralas persegi sisi $x$ dm dan tinggi $h$ dm bervolume 16 dm³. Tinggi tidak boleh lebih dari 1 dm.\na. Susun luas bahan $A(x)$ dalam $x$ saja.\nb. Tentukan $x$ yang meminimumkan $A$ tanpa batas tinggi, buktikan minimum, dan hitung $h$. Apakah memenuhi batas tinggi?\nc. Buat rancangan akhir yang memenuhi batas tinggi.",e:"a. $h=\\frac{16}{x^2}$, $A=x^2+4xh=x^2+\\frac{64}x$.\nb. $A'=2x-\\frac{64}{x^2}=0\\Rightarrow x^3=32$, $x\\approx3{,}17$ dm, $h\\approx1{,}59$ dm. $A''=2+\\frac{128}{x^3}>0$, jadi minimum. Tinggi melebihi 1 dm, maka tidak memenuhi.\nc. $h\\le1\\Rightarrow x^2\\ge16$, $x\\ge4$. Karena $A$ naik untuk $x>3{,}17$, pilih $x=4$ dm, $h=1$ dm, $A=16+16=32$ dm².",h:"Bak tanpa tutup beralas persegi: biaya minimum saat $h=\\frac x2$ ($1{,}59\\approx\\frac{3{,}17}2$). Jika kendala membuat titik optimum tak layak, pilih ukuran terdekat yang diperbolehkan."});
P2(12,0,E,{q:"Lampu titik dipasang pada tiang setinggi $h$ m di atas titik O. Titik P pada lantai berjarak 2 m dari O. Iluminasi di P adalah $E(h)=\\frac{kh}{(h^2+4)^{3/2}}$, $k>0$. Teknisi berpendapat: \"Makin tinggi lampu, makin terang P, jadi pasang di 4 m.\"\na. Tentukan $E'(h)$ dan sederhanakan.\nb. Tentukan $h$ yang memberi iluminasi maksimum dan buktikan itu maksimum.\nc. Evaluasi pendapat teknisi dengan membandingkan $E(4)$ dan iluminasi maksimum.",e:"a. $E'=\\frac{k(4-2h^2)}{(h^2+4)^{5/2}}$.\nb. $E'=0\\Rightarrow h=\\sqrt2\\approx1{,}41$ m. $E'>0$ untuk $h<\\sqrt2$ dan $E'<0$ untuk $h>\\sqrt2$, sehingga maksimum.\nc. $E_{maks}\\approx\\frac{1{,}41k}{6^{3/2}}\\approx0{,}096k$, sedangkan $E(4)=\\frac{4k}{20^{3/2}}\\approx0{,}045k$ (sekitar 46% dari maksimum). Pendapat teknisi keliru; pasang lampu sekitar 1,4 m.",h:"Iluminasi maksimum saat $h=\\frac d{\\sqrt2}$: dengan $d=2$ diperoleh $\\sqrt2$."});

var K="lat_ind_v2",S={};
try{S=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){S={}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function st(i){var n=0,c=0,d=0,Q=D[i].qs;for(var j=0;j<Q.length;j++){if(Q[j].r)continue;d++;var r=S[i+"_"+j];if(r&&r.done){n++;var ok=r.ok;if(!ok&&Q[j+1]&&Q[j+1].r){var rr=S[i+"_"+(j+1)];ok=rr&&rr.done&&rr.ok}if(ok)c++}}
 if(!n)return[0,"Belum dicoba"];if(c==d)return[2,"Tuntas"];if(n<d)return[1,"Sedang belajar"];return[c?1:3,c?"Sedang belajar":"Belum tuntas"]}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function mj(el){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(function(){})}
function summary(){var h="",tn=0;D.forEach(function(d,i){var s=st(i);if(s[0]==2)tn++;h+='<a class="chip t'+d.t+'" href="#i'+(i+1)+'"><b>I-'+(i+1)+'</b><span class="st s'+s[0]+'">'+s[1]+'</span></a>'});
 document.getElementById("sum").innerHTML=h;document.getElementById("pb").style.width=(tn/D.length*100)+"%";
 document.getElementById("pt").textContent=tn+" dari "+D.length+" indikator tuntas"}
var LB={pg:"Pilihan Ganda",mj:"Pilihan Ganda Majemuk",es:"Uraian"};
function body(i){var d=D[i],o='<div class="tp">Indikator I-'+(i+1)+' · TP '+d.t+'</div><div class="can">'+d.ind+'</div>';
 d.qs.forEach(function(q,j){var k=i+"_"+j,r=S[k]||{};if(q.r){var pr=S[i+"_"+(j-1)];if(!(pr&&pr.done&&!pr.ok))return}
  o+='<div class="q"><div class="tags"><span class="tag '+q.y+'">'+LB[q.y]+'</span><span class="tag">'+(q.r?"★ Soal Perbaikan":"Soal "+(j+1))+'</span></div><p style="white-space:pre-line">'+q.q+'</p>';
  var fin="";
  if(q.y==E){
   o+='<textarea id="ta'+k+'" placeholder="Tulis langkah penyelesaianmu di sini..." oninput="txt(\''+k+'\',this.value)" '+(r.rev?"readonly":"")+'>'+esc(r.txt||"")+'</textarea>';
   if(!r.rev)o+='<button class="btn" onclick="rev(\''+k+'\','+i+')">Lihat Pembahasan</button>';
   else{fin='<div class="fb rv"><b>Pembahasan formal</b>\n'+q.e+'</div>';
    if(!r.done)fin+='<p>Bandingkan dengan jawabanmu:</p><button class="btn y" onclick="self(\''+k+'\',1,'+i+')">Sudah sesuai</button><button class="btn n" onclick="self(\''+k+'\',0,'+i+')">Perlu diperbaiki</button>'}
  }else{
   q.o.forEach(function(t,x){var c="opt";if(r.done){if(x==q.a)c+=" ok";else if(x==r.pick)c+=" no"}else if(x==r.pick)c+=" sel";
    o+='<button class="'+c+'" '+(r.done?"disabled":"")+' onclick="pick(\''+k+'\','+x+','+i+')">'+String.fromCharCode(65+x)+'. '+t+'</button>'});
   if(r.done)fin='<div class="fb '+(r.ok?"ok":"no")+'"><b>'+(r.ok?"Benar!":"Belum tepat. Jawaban benar: "+String.fromCharCode(65+q.a)+".")+'</b>\n<b>Pembahasan formal</b>\n'+q.e+'</div>';
   else o+='<button class="btn" '+(r.pick==null?"disabled":"")+' onclick="check(\''+k+'\','+i+','+j+')">Cek Jawaban</button>'}
  if(fin){o+=fin+'<div class="hack"><b>★ Secret Hack</b>\n'+q.h+'</div><p><button class="btn g" onclick="again(\''+k+'\','+i+')">Coba lagi soal ini</button></p>'}
  o+='</div>'});return o}
function sec(i){var el=document.getElementById("i"+(i+1));el.innerHTML=body(i);mj(el);summary()}
function build(){var r=document.getElementById("root"),h="";D.forEach(function(d,i){h+='<section id="i'+(i+1)+'" class="t'+d.t+'"></section>'});r.innerHTML=h;D.forEach(function(d,i){document.getElementById("i"+(i+1)).innerHTML=body(i)});summary()}
function pick(k,x,i){S[k]={pick:x};save();sec(i)}
function check(k,i,j){var r=S[k];S[k]={pick:r.pick,done:1,ok:r.pick==D[i].qs[j].a};save();sec(i)}
function txt(k,v){S[k]=S[k]||{};S[k].txt=v;save()}
function rev(k,i){S[k]=S[k]||{};S[k].rev=1;save();sec(i)}
function self(k,ok,i){S[k].done=1;S[k].ok=!!ok;save();sec(i)}
function again(k,i){var p=k.split("_");delete S[k];delete S[p[0]+"_"+(+p[1]+1)];save();sec(i)}
document.getElementById("rs").onclick=function(){if(confirm("Hapus semua progres di perangkat ini?")){S={};save();build();mj(document.getElementById("root"))}};
build();
</script></body></html>
