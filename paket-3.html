{y:E,q:"Peternak memiliki pagar 120 m untuk membuat kandang persegi panjang dengan satu sekat di tengah yang sejajar sisi pendek (jadi ada 3 ruas pagar sepanjang $x$ dan 2 ruas sepanjang $y$).\na. Susun fungsi luas $L(x)$ dalam $x$ saja.\nb. Tentukan $x$ dan $y$ yang membuat luas maksimum dan buktikan itu maksimum.\nc. Berapa luas maksimumnya?",e:"a. $3x+2y=120\\Rightarrow y=\\frac{120-3x}2$, $L=xy=60x-\\frac32x^2$.\nb. $L'=60-3x=0\\Rightarrow x=20$, $y=30$. $L''=-3<0$, maksimum.\nc. $L_{maks}=20\\times30=600$ m².",h:"Pagar dibagi rata: separuh pagar untuk ruas $x$ ($3x=60$) dan separuh untuk $y$ ($2y=60$)."}]},

{y:M,q:"Empat siswa menyelesaikan limit berikut.\nSiswa A: $\\lim_{x\\to4}\\frac{x^2-16}{x-4}=8$.\nSiswa B: $\\lim_{x\\to0}\\frac{\\sin6x}{x}=1$.\nSiswa C: $\\lim_{x\\to\\infty}\\frac{3x^2+1}{x^2+5}=\\infty$.\nSiswa D: $\\lim_{x\\to\\infty}\\frac{3x^2+1}{x^2+5}=3$.\n(1) Siswa A benar.\n(2) Siswa B keliru; hasil yang benar 6.\n(3) Siswa C keliru; pangkat sama sehingga hasilnya rasio koefisien.\n(4) Siswa D keliru.\nPenilaian yang tepat adalah ....",o:["(1) dan (4) saja","(2) dan (3) saja","(1), (2), dan (4) saja","(1), (2), dan (3) saja","(1), (2), (3), dan (4)"],a:3,e:"A benar ($x+4\\to8$). B keliru: $\\lim\\frac{\\sin6x}x=6$. C keliru: pangkat sama, limit 3. D benar, jadi (4) salah.",h:"Pangkat sama: rasio koefisien depan; bukan $\\infty$."}]}

RP(10,1,{y:E,q:"Peternak memiliki pagar 90 m untuk kandang persegi panjang dengan satu sekat di tengah yang sejajar sisi pendek (3 ruas sepanjang $x$ dan 2 ruas sepanjang $y$).\na. Susun fungsi luas $L(x)$ dalam $x$ saja.\nb. Tentukan $x$ dan $y$ yang membuat luas maksimum dan buktikan itu maksimum.\nc. Berapa luas maksimumnya?",e:"a. $3x+2y=90\\Rightarrow y=\\frac{90-3x}2$, $L=45x-\\frac32x^2$.\nb. $L'=45-3x=0\\Rightarrow x=15$, $y=22{,}5$. $L''=-3<0$, maksimum.\nc. $L_{maks}=15\\times22{,}5=337{,}5$ m².",h:"Pagar dibagi rata: $3x=45$ dan $2y=45$."});

  o+='<div class="q"><div class="tags"><span class="tag '+q.y+'">'+LB[q.y]+'</span><span class="tag">'+(q.r?"★ Soal Perbaikan":"Soal "+(j+1))+'</span></div><p style="white-space:pre-line">'+q.q+'</p>';
  var fin="";

   o+='<textarea id="ta'+k+'" placeholder="Tulis langkah penyelesaianmu di sini..." oninput="txt(\''+k+'\',this.value)" '+(r.rev?"readonly":"")+'>'+esc(r.txt||"")+'</textarea>';
